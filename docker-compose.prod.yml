# Üretim dağıtımı — Faz 6 (YOL_HARİTASI.md).
#
# docker-compose.yml (dev) ile KARIŞTIRMAYIN: mailhog yok, backend/frontend/
# postgres/ollama portları yalnızca localhost'a bağlı — dışa açılım TEK
# NOKTADAN, aşağıdaki `caddy` servisiyle yapılır (80/443, tek kamuya açık
# servis). Domain hâlâ YER TUTUCU (unibox.universite.edu.tr) — Caddyfile ve
# aşağıdaki build.args ile TUTARLI olmalı, gerçek domain belli olunca ikisi
# birden güncellenmeli.
#
# Kullanım:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm backend uv run alembic upgrade head
#
# Gerekli değişkenler (kök dizindeki .env dosyasından okunur):
#   POSTGRES_PASSWORD, NEXT_PUBLIC_API_URL, NEXT_PUBLIC_WS_URL
#
# ÖNEMLİ: NEXT_PUBLIC_API_URL / NEXT_PUBLIC_WS_URL / BACKEND_URL üçü de
# frontend/Dockerfile'da BUILD ARG'ı — Next.js rewrites() çıktısı derleme
# zamanında donuyor, `environment:` ile runtime'da değiştirilemiyor
# (ölçüldü, bkz. frontend/Dockerfile başındaki not). Domain değişirse
# frontend İMAJI YENİDEN DERLENMELİ, yalnızca container yeniden
# başlatılması yetmez.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unibox_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil - .env dosyasina ekleyin}
      POSTGRES_DB: unibox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DİKKAT: Uygulama varsayılan olarak HOST'taki Ollama'yı kullanır
  # (backend/.env -> OLLAMA_BASE_URL). Bu container'ı kullanacaksanız
  # backend/.env'de OLLAMA_BASE_URL=http://ollama:11434 yapın VE modelleri
  # container'a indirin — aksi halde RAG hiçbir sonuç döndürmez:
  #   docker compose -f docker-compose.prod.yml exec ollama ollama pull llama3.1:8b bge-m3
  ollama:
    image: ollama/ollama:latest
    container_name: unibox_ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unibox_backend
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL tanimli degil, ornek: https://unibox.universite.edu.tr/api/backend}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL tanimli degil, ornek: wss://unibox.universite.edu.tr}"
        BACKEND_URL: http://backend:8000
    container_name: unibox_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Tek kamuya açık servis. TLS'i (Let's Encrypt) otomatik alır/yeniler —
  # 80/443'ün gerçekten internete açık olması ve Caddyfile'daki domain'in
  # gerçek, bu sunucuya işaret eden bir DNS kaydı olması ŞART, aksi halde
  # sertifika doğrulaması başarısız olur.
  caddy:
    image: caddy:2-alpine
    container_name: unibox_caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    name: unibox_postgres_data_prod
  ollama_data:
    name: unibox_ollama_data_prod
  caddy_data:
    name: unibox_caddy_data_prod
  caddy_config:
    name: unibox_caddy_config_prod
