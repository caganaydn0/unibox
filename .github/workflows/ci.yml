name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Ruff
        working-directory: backend
        run: uv run ruff check .

      # DB/Ollama gerektiren testler (rag_eval) atlanır — servis yok. Kalan
      # testler (34'ü hiç servis gerektirmiyor, geri kalanı servis kapalıyken
      # sessizce skip ediliyor) her push'ta koşar. Bkz. YOL_HARİTASI.md
      # "Test altyapısı".
      - name: pytest
        working-directory: backend
        run: uv run pytest -m "not rag_eval" -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      # next build tip hatalarında da başarısız olur (next lint Next.js 16'da
      # kaldırıldığı için ayrı bir lint adımı yok, bkz. YOL_HARİTASI.md).
      # NEXT_PUBLIC_*/BACKEND_URL burada önemsiz — yalnızca derlemenin
      # başarılı olduğunu doğruluyoruz, gerçek deploy değerleri
      # docker-compose.prod.yml build.args'ında.
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/backend
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
        run: npm run build
