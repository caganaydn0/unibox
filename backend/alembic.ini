[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Bu değer HİÇBİR ZAMAN kullanılmaz — alembic/env.py, migration'ları
# çalıştırmadan önce settings.DATABASE_URL ile (hem online hem offline modda)
# üzerine yazar. Alembic ini dosyasının bu anahtarı zorunlu kılması nedeniyle
# burada duruyor; gerçek görünümlü bir kimlik bilgisi olmasın diye placeholder.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
