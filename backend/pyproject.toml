[project]
name = "unibox-backend"
version = "0.1.0"
description = "UniBox — KVKK uyumlu üniversite AI asistanı backend"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    # Database
    "sqlalchemy>=2.0.0",
    # aiosmtpd — dev SMTP (Docker'sız mail test)
    "aiosmtpd>=1.4.0",
    "alembic>=1.13.0",
    # Pydantic
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # PostgreSQL + pgvector
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    # RAG text splitting
    "langchain-text-splitters>=0.2.0",
    # llama-cpp isteğe bağlı — yorum açarak ekleyin:
    # "llama-cpp-python>=0.2.90",
    # KVKK / Güvenlik
    "cryptography>=43.0.0",    # Fernet
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",
    # Email
    "aiosmtplib>=3.0.0",
    # Dosya işleme
    "python-multipart>=0.0.9",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",  # Windows MIME tipi (libmagic dahil)
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "pypdf>=4.3.0",
    # Yardımcılar
    "httpx>=0.27.0",
    "python-docx>=1.1.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Bilinçli olarak dar: E9 (syntax) + F (pyflakes — kullanılmayan import,
# tanımsız isim vb. gerçek hatalar). Ruff'ın örtük geniş varsayılanı (UP/B/
# DTZ/BLE/G/TRY/ISC/S/PL/RUF dahil) 288 mevcut bulgu çıkardı; çoğu
# Optional[X]→X|None gibi salt stil tercihi. Bunları CI'a katmadan önce ayrı
# bir oturumda bilinçli olarak taranıp uygulanmalı — bazıları (DTZ003:
# datetime.utcnow) zaten pytest.ini_options filterwarnings'te "ayrı bir iş"
# olarak not düşülmüş.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Döngü kapsamı OTURUM olmalı. db/session.py motoru modül seviyesinde kurar ve
# asyncpg bağlantıları oluşturuldukları event loop'a bağlıdır. Varsayılan
# fonksiyon kapsamıyla, oturum kapsamlı korpus fixture'ı bir döngüde bağlantı
# açar, testler başka döngüde kullanır ve "Event loop is closed" alınır.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# backend/ kökünü sys.path'e ekler; scriptlerdeki elle sys.path.insert
# hilesinin yerini alır (8 script bunu kopyalıyordu).
pythonpath = ["."]
# Ölçüm testleri canlı servis gerektiriyor; CI'da yalnızca saf testler koşar.
#   uv run pytest -m "not rag_eval and not slow"   # DB/Ollama gerekmez
#   uv run pytest -m rag_eval                      # Postgres + Ollama gerekir
#   uv run pytest -m slow                          # ayrıca LLM üretimi yapar
markers = [
    "rag_eval: canlı Postgres + Ollama ve indekslenmiş fixture korpusu gerektirir",
    "slow: LLM üretimi yapar; dakikalar sürebilir ve tam deterministik değildir",
]
filterwarnings = [
    # datetime.utcnow() Python 3.12'de deprecated; kod tabanında hâlâ var
    # (rag_engine.py, knowledge.py). Ayrı bir iş olarak temizlenecek.
    "ignore::DeprecationWarning:app.*",
]
