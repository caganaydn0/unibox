[project]
name = "unibox-backend"
version = "0.1.0"
description = "UniBox — KVKK uyumlu üniversite AI asistanı backend"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    # Database
    "sqlalchemy>=2.0.0",
    # aiosmtpd — dev SMTP (Docker'sız mail test)
    "aiosmtpd>=1.4.0",
    "alembic>=1.13.0",
    # Pydantic
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # PostgreSQL + pgvector
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    # RAG text splitting
    "langchain-text-splitters>=0.2.0",
    # llama-cpp isteğe bağlı — yorum açarak ekleyin:
    # "llama-cpp-python>=0.2.90",
    # KVKK / Güvenlik
    "cryptography>=43.0.0",    # Fernet
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",
    # Email
    "aiosmtplib>=3.0.0",
    # Dosya işleme
    "python-multipart>=0.0.9",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",  # Windows MIME tipi (libmagic dahil)
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "pypdf>=4.3.0",
    # Yardımcılar
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
